<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Acesso - LPR</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; }
        
        .container { display: flex; width: 100%; padding: 20px; gap: 20px; }
        
        .video-section { flex: 2; background-color: var(--panel-bg); border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); }
        .video-header { background-color: var(--primary-color); color: white; padding: 15px 20px; font-weight: bold; }
        .video-feed { flex: 1; background-color: #000; display: flex; align-items: center; justify-content: center; }
        .video-feed img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .settings-section { flex: 1; background-color: var(--panel-bg); border-radius: 10px; padding: 20px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; }
        .settings-section h2 { font-size: 1.2rem; color: var(--primary-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; font-weight: 600; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; }
        
        .btn-submit { background-color: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="container">
        <div class="video-section">
            <div class="video-header">Monitoramento em Tempo Real - LPR</div>
            <div class="video-feed">
                <img src="/video_feed" alt="Video Feed">
                <!-- Overlay de Notificação -->
                <div id="notificationOverlay" style="display:none; position: absolute; top: 10px; right: 10px; padding: 15px; border-radius: 8px; color: white; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                    <button onclick="hideNotification()" style="float:right; border:none; background:none; cursor:pointer; color:white;">X</button>
                    <h3 id="notifTitle"></h3>
                    <p id="notifBody"></p>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <h2>Configurações do Sistema</h2>
            <form id="configForm">
                <div class="form-group">
                    <label for="videoSource">Fonte de Vídeo</label>
                    <select id="videoSource" onchange="toggleSource()">
                        <option value="rtsp" selected>Câmera IP (RTSP)</option>
                        <option value="usb">Webcam USB Local</option>
                    </select>
                </div>

                <div class="form-group" id="rtspGroup">
                    <label for="rtspUrl">URL da Câmera (RTSP)</label>
                    <input type="text" id="rtspUrl" placeholder="rtsp://usuario:senha@ip/stream" required>
                </div>

                <div class="form-group">
                    <label for="ocrConfidence">Confiança Mínima do OCR (%)</label>
                    <input type="number" id="ocrConfidence" min="1" max="100" value="40" required>
                </div>

                <div class="form-group">
                    <label for="matchTolerance">Tolerância (Levenshtein)</label>
                    <input type="number" id="matchTolerance" min="0" max="5" value="1" required>
                </div>

                <button type="button" class="btn-submit" onclick="aplicarConfiguracoes()">Aplicar Configurações e Iniciar</button>
            </form>

            <hr style="margin: 20px 0;">

            <h2>Teste de Imagem Estática</h2>
            <div class="form-group">
                <input type="file" accept="image/*" id="imageUpload">
                <button type="button" class="btn-submit" onclick="testarImagem()">Testar Imagem</button>
                <button type="button" class="btn-submit" style="background-color: #7f8c8d;" onclick="voltarParaCamera()">Voltar para Câmera</button>
            </div>
        </div>
    </div>

    <script>
        let lastNotifTimestamp = null;
        let notifTimeout = null;

        function showNotification(data) {
            const overlay = document.getElementById('notificationOverlay');
            const title = document.getElementById('notifTitle');
            const body = document.getElementById('notifBody');

            overlay.style.display = 'block';
            overlay.style.backgroundColor = (data.status === 'autorizado') ? '#27ae60' : '#c0392b';
            title.innerText = (data.status === 'autorizado') ? 'Acesso Permitido' : 'Acesso Negado';
            body.innerText = (data.status === 'autorizado') 
                ? `Servidor: ${data.nome}\nPlaca: ${data.placa}`
                : `Placa ${data.placa} não reconhecida!`;

            clearTimeout(notifTimeout);
            notifTimeout = setTimeout(hideNotification, 30000);
        }

        function hideNotification() {
            document.getElementById('notificationOverlay').style.display = 'none';
        }

        setInterval(() => {
            fetch('/get_detection')
                .then(r => r.json())
                .then(data => {
                    if (data.timestamp && data.timestamp !== lastNotifTimestamp) {
                        lastNotifTimestamp = data.timestamp;
                        showNotification(data);
                    }
                });
        }, 1000);

        function toggleSource() {
            const source = document.getElementById('videoSource').value;
            const rtspGroup = document.getElementById('rtspGroup');
            rtspGroup.style.display = (source === 'usb') ? 'none' : 'block';
        }

        function aplicarConfiguracoes() {
            const source = document.getElementById('videoSource').value;
            const url = document.getElementById('rtspUrl').value;

            fetch('/update_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sourceType: source, rtspUrl: url })
            })
            .then(response => response.json())
            .then(data => {
                alert("Configurações aplicadas!");
                voltarParaCamera();
            })
            .catch(error => console.error('Erro:', error));
        }

        function testarImagem() {
            const input = document.getElementById('imageUpload');
            if (input.files.length === 0) return alert("Selecione uma imagem!");
            const formData = new FormData();
            formData.append('file', input.files[0]);

            fetch('/test_image', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                document.querySelector('.video-feed img').src = "data:image/jpeg;base64," + data.image;
            })
            .catch(error => console.error('Erro:', error));
        }

        function voltarParaCamera() {
            const feedImg = document.querySelector('.video-feed img');
            feedImg.src = "/video_feed?t=" + new Date().getTime();
        }
    </script>
</body>
</html>
